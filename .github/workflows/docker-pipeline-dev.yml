---
# =============================================================================
# Docker Pipeline Image - Development Build & Push
# =============================================================================
# Triggers on push to main branch (after PR merge)
# Builds and pushes Pipeline image to GitHub Container Registry (ghcr.io)
# Tags: dev (floating)
# =============================================================================

name: Build & Push Pipeline Dev Image

"on":
  push:
    branches: [main]
    paths:
      # Only trigger when Docker-related files change
      - "docker/pipeline.dockerfile"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - "pipeline.yaml"
      - "companies.yaml"
      - "prefect.yaml"
      - ".github/workflows/docker-pipeline-dev.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-pipeline

jobs:
  build-and-push:
    name: Build & Push Pipeline Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      # -----------------------------------------------------------------------
      # Checkout & Setup
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Authentication
      # -----------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Metadata (tags & labels)
      # -----------------------------------------------------------------------
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Floating dev tag - Railway will monitor this
            type=raw,value=dev

      # -----------------------------------------------------------------------
      # Build & Push
      # -----------------------------------------------------------------------
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/pipeline.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      # -----------------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------------
      - name: Generate build summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## 🐳 Docker Image Published"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Registry** | \`$REGISTRY\` |"
            echo "| **Image** | \`$IMAGE_NAME\` |"
            echo "| **Digest** | \`$DIGEST\` |"
            echo "| **Tag** | \`dev\` |"
            echo "| **Commit** | \`${GITHUB_SHA::7}\` |"
            echo ""
            echo "### Pull Command"
            echo "\`\`\`bash"
            echo "docker pull $REGISTRY/$IMAGE_NAME:dev"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
